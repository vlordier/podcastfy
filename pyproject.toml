[tool.poetry]
name = "podcastfy"
version = "0.4.3"
description = "An Open Source alternative to NotebookLM's podcast feature: Transforming Multimodal Content into Captivating Multilingual Audio Conversations with GenAI"
authors = ["Tharsis T. P. Souza"]
license = "Apache-2.0"
readme = "README.md"
include = [
    "podcastfy/config.yaml",
    "podcastfy/conversation_config.yaml"
]

[tool.poetry.dependencies]
python = "^3.12"
setuptools = "^75.1.0"
wheel = "^0.44.0"
cython = "^3.0.11"
typer = "^0.12.5"
python-dotenv = "^1.0.1"
requests = "^2.32.3"
beautifulsoup4 = "^4.12.3"
openai = "^1.56.1"
elevenlabs = "^1.9.0"
PyMuPDF = "^1.24.11"
pyyaml = "^6.0.2"
youtube-transcript-api = "^0.6.2"
pydub = "^0.25.1"
fuzzywuzzy = "^0.18.0"
python-levenshtein = "^0.26.0"
pandas = "^2.2.3"
google-generativeai = "^0.8.2"
numpy = ">=1,<2"
langchain = "^0.3.3"
langchain-google-vertexai = "^2.0.4"
langchain-google-genai = "^2.0.1"
httpx = "^0.28.1"
pandoc = "^2.4"
sphinx-rtd-theme = "^3.0.1"
sphinx-autodoc-typehints = "^2.5.0"
nbsphinx = "^0.9.5"
edge-tts = "^7.2.3"
types-pyyaml = "^6.0.12.20240917"
nest-asyncio = "^1.6.0"
ffmpeg = "^1.4"
pytest = "^8.3.3"
pytest-xdist = "^3.6.1"
google-cloud-texttospeech = "^2.21.0"
google-genai = "^1.46.0"
litellm = "^1.52.0"
langchain-community = "^0.3.5"
playwright = "^1.49"
fastapi = "^0.115"
uvicorn = "^0.34"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
sphinx = ">=8.0.2"
nbsphinx = "0.9.5"
ipykernel = "^6.29.5"
ffmpeg = "^1.4"
mypy = "^1.11.2"
ruff = "^0.15.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
build_docs = "build_docs:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings
    "ANN",     # annotations (too noisy for existing codebase)
    "COM812",  # trailing comma
    "E501",    # line length (handled by formatter)
    "INP001",  # implicit namespace package
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "C901",    # too complex
    "FBT001",  # boolean positional arg
    "FBT002",  # boolean positional arg
    "B008",    # function call in default
    "ARG001",  # unused function arg
    "ARG002",  # unused method arg (ABC interface compliance)
    "FAST002", # FastAPI dependency without Annotated
    "TRY301",  # abstract raise
    "BLE001",  # blind exception
    "G004",    # logging f-string
    "G201",    # logging .exception
    "RET505",  # unnecessary else after return
    "SIM102",  # nested if
    "SIM105",  # suppress
    "PERF403", # dict comprehension
    "RUF010",  # explicit conversion flag
    "UP015",   # unnecessary mode
    "PTH",     # pathlib (too many to fix in one pass)
    "Q000",    # quote style
    "TID252",  # relative imports
    "FBT003",  # boolean positional arg
    "PLR2004", # magic value comparison
    "TRY400",  # logging.exception
    "B904",    # raise from
    "F841",    # unused variable
    "W293",    # blank line whitespace
    "N806",    # non-lowercase variable (intentional constants)
    "TRY300",  # move to else block
    "TRY002",  # create own exception
    "TRY003",  # avoid long exception messages
    "EM101",   # exception string literal
    "EM102",   # exception f-string literal
    "SIM108",  # ternary operator
    "RET504",  # unnecessary assignment before return
    "RUF005",  # collection concatenation
    "RUF012",  # mutable class default
    "ASYNC230", # async file open
    "ASYNC240", # async os.path
    "PLC0415", # import at top level
    "T201",    # print found
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "INP001", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"



