content_generator:
  llm_model: "gemini-2.5-flash"
  max_output_tokens: 8192
  prompt_template: "souzatharsis/podcastfy_multimodal_cleanmarkup"
  prompt_commit: "b2365f11"
  longform_prompt_template: "souzatharsis/podcastfy_longform"
  longform_prompt_commit: "acfdbc91" #"ff865019"

website_extractor:
  jina_api_url: "https://r.jina.ai"
  markdown_cleaning:
    remove_patterns:
      - '!\[.*?\]\(.*?\)'  # Remove markdown images
      - '\[([^\]]+)\]\([^\)]+\)'  # Remove markdown links
      - 'https?://\S+|www\.\S+'  # Remove bare URLs
      - '\[.*?\]'  # Remove remaining square brackets and contents
      - '\(.*?\)'  # Remove remaining parentheses and contents
      - '^\s*[-*]\s'  # Remove list item markers
      - '^\s*\d+\.\s'  # Remove numbered list markers
      - '^\s*#+'  # Remove markdown headers
  unwanted_tags:
    - 'script'
    - 'style'
    - 'nav'
    - 'footer'
    - 'header'
    - 'aside'
    - 'noscript'
  user_agent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36'
  timeout: 10  # Request timeout in seconds

youtube_transcriber:
  remove_phrases:
    - "[music]"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
